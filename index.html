<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Todo</title>
<style>
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
    background: #1a1a1a;
    color: #e0e0e0;
    min-height: 100vh;
    display: flex;
    justify-content: center;
    padding: 40px 16px;
  }
  .app {
    width: 100%;
    max-width: 520px;
  }
  h1 {
    font-size: 28px;
    font-weight: 600;
    margin-bottom: 20px;
    color: #f5f5f5;
  }
  .input-row {
    display: flex;
    gap: 8px;
    margin-bottom: 20px;
  }
  #task-input {
    flex: 1;
    padding: 12px 14px;
    font-size: 15px;
    background: #2a2a2a;
    border: 1px solid #3a3a3a;
    border-radius: 8px;
    color: #e0e0e0;
    outline: none;
  }
  #task-input:focus { border-color: #555; }
  #add-btn {
    padding: 12px 18px;
    font-size: 15px;
    background: #4a4af0;
    border: none;
    border-radius: 8px;
    color: #fff;
    cursor: pointer;
    font-weight: 500;
  }
  #add-btn:hover { background: #5a5aff; }
  #add-btn:active { background: #3a3ae0; }
  ul { list-style: none; }
  .task {
    display: flex;
    align-items: center;
    gap: 12px;
    padding: 12px 14px;
    background: #242424;
    border: 1px solid #333;
    border-radius: 8px;
    margin-bottom: 8px;
  }
  .task input[type="checkbox"] {
    width: 18px;
    height: 18px;
    cursor: pointer;
    accent-color: #4a4af0;
    flex-shrink: 0;
  }
  .task span {
    flex: 1;
    font-size: 15px;
    word-break: break-word;
    line-height: 1.4;
  }
  .task.done span {
    text-decoration: line-through;
    color: #777;
  }
  .del-btn {
    background: none;
    border: none;
    color: #888;
    font-size: 18px;
    cursor: pointer;
    padding: 2px 6px;
    line-height: 1;
    border-radius: 4px;
  }
  .del-btn:hover { color: #e55; }
  .empty {
    text-align: center;
    color: #666;
    padding: 30px 0;
    font-size: 14px;
  }
</style>
</head>
<body>
  <div class="app">
    <h1>Todo</h1>
    <div class="input-row">
      <input id="task-input" type="text" placeholder="Add a new task..." autocomplete="off">
      <button id="add-btn">Add</button>
    </div>
    <ul id="task-list"></ul>
    <div id="empty-msg" class="empty">No tasks yet.</div>
  </div>
<script>
(function () {
  "use strict";

  var STORAGE_KEY = "todo.tasks";
  var input = document.getElementById("task-input");
  var addBtn = document.getElementById("add-btn");
  var list = document.getElementById("task-list");
  var emptyMsg = document.getElementById("empty-msg");

  function load() {
    try {
      var raw = localStorage.getItem(STORAGE_KEY);
      return raw ? JSON.parse(raw) : [];
    } catch (e) {
      return [];
    }
  }

  function save(tasks) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(tasks));
    } catch (e) {
      /* ignore quota / private mode errors */
    }
  }

  var tasks = load();

  function escapeHtml(str) {
    var div = document.createElement("div");
    div.textContent = str;
    return div.innerHTML;
  }

  function render() {
    list.innerHTML = "";
    if (tasks.length === 0) {
      emptyMsg.style.display = "block";
      return;
    }
    emptyMsg.style.display = "none";

    tasks.forEach(function (task, i) {
      var li = document.createElement("li");
      li.className = "task" + (task.done ? " done" : "");

      var checkbox = document.createElement("input");
      checkbox.type = "checkbox";
      checkbox.checked = task.done;
      checkbox.addEventListener("change", function () {
        tasks[i].done = checkbox.checked;
        save(tasks);
        render();
      });

      var span = document.createElement("span");
      span.innerHTML = escapeHtml(task.text);

      var delBtn = document.createElement("button");
      delBtn.className = "del-btn";
      delBtn.innerHTML = "&times;";
      delBtn.setAttribute("aria-label", "Delete task");
      delBtn.addEventListener("click", function () {
        tasks.splice(i, 1);
        save(tasks);
        render();
      });

      li.appendChild(checkbox);
      li.appendChild(span);
      li.appendChild(delBtn);
      list.appendChild(li);
    });
  }

  function addTask() {
    var text = input.value.trim();
    if (!text) return;
    tasks.push({ text: text, done: false });
    input.value = "";
    save(tasks);
    render();
  }

  addBtn.addEventListener("click", addTask);
  input.addEventListener("keydown", function (e) {
    if (e.key === "Enter") addTask();
  });

  render();
  input.focus();
})();
</script>
</body>
</html>
